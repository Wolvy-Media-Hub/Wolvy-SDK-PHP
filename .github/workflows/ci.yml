name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.0', '8.1', '8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, json
          coverage: none
          tools: composer

      - name: Validate composer.json
        run: composer validate --strict

      # No dependencies to install: this only writes vendor/autoload.php, so the tests load the
      # SDK through composer.json's PSR-4 and "files" entries, as an application would.
      - name: Build the autoloader
        run: composer dump-autoload

      - name: Lint
        run: find src config tests -name '*.php' -print0 | xargs -0 -n1 php -l

      # Unit tests only: no network and no secrets. The integration suite needs a local copy of
      # the Developer API (see README, "Running the tests").
      - name: Unit tests
        run: php tests/run.php
